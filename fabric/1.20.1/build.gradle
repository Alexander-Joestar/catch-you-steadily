plugins {
    id 'fabric-loom' version '1.7.4'
}

group = 'dev.catchyou'
version = '0.1.0'
base.archivesName = 'catch-you-steadily-fabric-1.20.1'

loom {
    accessWidenerPath = file('src/main/resources/catch-you-steadily.accesswidener')
}

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('fabric/src/main/java')

java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }

configurations.named('compileClasspath') {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}
