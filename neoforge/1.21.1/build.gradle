plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.catchyou'
version = '0.1.0'
base.archivesName = 'catch-you-steadily-neoforge-1.21.1'

neoForge {
    version = '21.1.77'
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer-neoforge.cfg')
    }
    runs {
        server { server() }
    }
    mods {
        catch_you_steadily { sourceSet sourceSets.main }
    }
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('neoforge/src/main/java')
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.sourceCompatibility = JavaVersion.VERSION_1_8
java.targetCompatibility = JavaVersion.VERSION_1_8
['compileClasspath', 'runtimeClasspath'].each { configuration ->
    configurations.named(configuration) {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}
