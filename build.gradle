plugins {
    id 'base'
}

def windowsHost = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def legacyWrapper = file(windowsHost ? 'legacy/gradlew.bat' : 'legacy/gradlew')
def localJbr25 = file("${System.getProperty('user.home')}/.jdks/jbr-25.0.4.1-1")
def legacyJavaHome = System.getenv('LEGACY_JAVA_HOME')
if (legacyJavaHome == null && localJbr25.isDirectory()) {
    legacyJavaHome = localJbr25.absolutePath
}

tasks.register('buildLegacyVariants', Exec) {
    group = 'build'
    description = 'Builds both legacy variants with the legacy Gradle wrapper.'
    workingDir = file('legacy')
    if (legacyJavaHome != null) {
        environment 'JAVA_HOME', legacyJavaHome
        environment 'PATH', "${new File(legacyJavaHome, 'bin').absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
    }
    if (windowsHost) {
        commandLine 'cmd.exe', '/d', '/c', 'gradlew.bat', ':forge1122:build', ':forge1710:build', '--console=plain'
    } else {
        commandLine legacyWrapper, ':forge1122:build', ':forge1710:build', '--console=plain'
    }
}

tasks.register('buildReleaseJars') {
    group = 'build'
    description = 'Builds the six independent loader and Minecraft version jars.'
    dependsOn ':fabric1201:build', ':fabric1211:build', ':forge1201:build', ':neoforge1211:build', 'buildLegacyVariants'
}
